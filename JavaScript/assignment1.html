<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f3f0ff;
        }

        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .shop {
            background-color: lavender;
            border: 4px solid black;
            border-radius: 15px;
            width: 80%;
            max-width: 600px;
            padding: 30px;
        }

        h1 {
            text-align: center;
            margin-top: 0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 30px;
            background-color: white;
        }

        th,
        td {
            border: 2px solid black;
            padding: 12px;
            text-align: center;
        }

        th {
            background-color: #d8cfff;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        input {
            padding: 10px;
            border: 2px solid black;
            border-radius: 6px;
            font-size: 16px;
        }

        #submit {
            margin-top: 10px;
            background-color: black;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }

    </style>
</head>

<body>
    <div class="container">
        <div class="shop">

            <h1>Shoppppp!!!!</h1>
            <table>
                <tr>
                    <th>Product</th>
                    <th>Price</th>
                </tr>
                <tr>
                    <td>Tea</td>
                    <td>₹450</td>
                </tr>
                <tr>
                    <td>Coffee</td>
                    <td>₹600</td>
                </tr>
                <tr>
                    <td>Sugar</td>
                    <td>₹400</td>
                </tr>
                <tr>
                    <td>Chocolate</td>
                    <td>₹100</td>
                </tr>
            </table>

            <form>

                <label for="pname">Product</label>
                <input type="text" id="pname" placeholder="Enter product name">

                <label for="pquant">Quantity</label>
                <input type="number" id="pquant" placeholder="Enter quantity" min="1">

                <input type="button" value="SUBMIT" id="submit">

            </form>
        </div>
    </div>
    <script>
        const shop = {
            tea: 450,
            coffee: 600,
            sugar: 400,
            chocolate: 100
        };


        document.getElementById("submit").addEventListener("click", function () {

            let product = document.getElementById("pname").value.toLowerCase();
            let quant = Number(document.getElementById("pquant").value);


            if (shop[product] !== undefined) {

                let total = shop[product] * quant;

                alert("Total Price = " + total);

            } else {

                alert("Product not available");

            }

        });
    </script>
</body>
</html>
