<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operators</title>
</head>
<body>
    
    <script>

        let c = 400;
        let d = 100;
        let e = c+d;
        let f = c-d;
        let g = c*d;
        let h = c/d;
                
        document.write("e is assigned the value of :"+e);
        document.write("f is assigned the value of :"+f);
        document.write("g is assigned the value of :"+g);
        document.write("h is assigned the value of :"+h);

    </script>



</body>
</html>
